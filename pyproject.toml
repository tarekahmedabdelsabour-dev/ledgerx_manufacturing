[project]
name = "ledgerx_manufacturing"
authors = [{ name = "LedgerX", email = "hello@ledgerx.local" }]
description = "Manufacturing as a standalone LedgerX module: production lines, barcode scanning for operations, stages and materials, operator mobile screen, waste, cost and quality in one place"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
erpnext = ">=16.0.0-dev,<18.0.0"
