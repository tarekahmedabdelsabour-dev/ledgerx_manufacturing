{% extends "templates/web.html" %}
{% block navbar %}{% endblock %}
{% block footer %}{% endblock %}
{% block page_content %}
<style>
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef2f5}
.bar{padding:10px 16px;background:#0B2A5B;color:#fff;display:flex;gap:12px;align-items:center}
.bar button{padding:6px 16px;border:0;border-radius:6px;font:inherit;cursor:pointer}
.sheet{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.label{width:62mm;height:38mm;background:#fff;border:1px dashed #9aa;padding:2mm;box-sizing:border-box;text-align:center;overflow:hidden;page-break-inside:avoid}
.label .t{font-weight:700;font-size:11pt;line-height:1.1;max-height:8mm;overflow:hidden}
.label .s{font-size:8pt;color:#333;max-height:6mm;overflow:hidden}
.label svg{width:100%;height:18mm}
@media print{.bar{display:none}body{background:#fff}.sheet{padding:0;gap:0}.label{border:0}}
</style>

<div class="bar"><b>{{ title }} - {{ doctype_label }}</b><button onclick="window.print()">&#128424; {{ _("Print") }}</button></div>
<div class="sheet">
{% for l in labels %}
<div class="label"><div class="t">{{ l.title }}</div><div class="s">{{ l.sub }}</div><svg class="bc" data-code="{{ l.code }}"></svg></div>
{% endfor %}
</div>
<script src="/assets/ledgerx_manufacturing/js/jsbarcode.code128.min.js"></script>
<script>
document.querySelectorAll("svg.bc").forEach(function (el) {
  try { JsBarcode(el, el.dataset.code, {format: "CODE128", displayValue: true, fontSize: 14, height: 50, margin: 0}); } catch (e) {}
});
</script>

{% endblock %}
